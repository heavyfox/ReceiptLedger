name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -v
      - name: Build Windows app
        run: ./build.ps1 -Python python
      - name: Test packaged app
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $appTest = Start-Process -FilePath './dist/ReceiptLedger/ReceiptLedger.exe' -ArgumentList '--self-test' -PassThru -WindowStyle Hidden
          if (-not $appTest.WaitForExit(60000)) { throw 'Packaged app self-test timed out' }
          if ($appTest.ExitCode -ne 0) { throw "Packaged app self-test failed: $($appTest.ExitCode)" }
